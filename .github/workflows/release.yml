name: Build and release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app bundle and disk image
        run: |
          ./script/build_and_run.sh package
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent dist/ArgonStudio.app dist/ArgonStudio-macOS.app.zip
          hdiutil create -volname ArgonStudio -srcfolder dist/ArgonStudio.app -ov -format UDZO dist/ArgonStudio-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: |
            dist/ArgonStudio-macOS.app.zip
            dist/ArgonStudio-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: release/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: release/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          files: artifacts/*
